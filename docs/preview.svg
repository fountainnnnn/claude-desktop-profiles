<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 240" width="720" height="240" role="img" aria-label="Two numbered launchers in a dock: Claude 1 for a personal account and Claude 2 for a work account">
  <!-- Self-contained colours (no theme media query), so it reads the same on
       light and dark pages whatever the viewer's system setting is. -->
  <defs>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B2B31"/>
      <stop offset="1" stop-color="#1D1D22"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EC9064"/>
      <stop offset="1" stop-color="#D2653A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <!-- Neutral glyph: a chat bubble, not Anthropic's logo. -->
    <path id="glyph" fill="#FFF" d="M-30 -24 h44 a10 10 0 0 1 10 10 v20 a10 10 0 0 1 -10 10 h-24 l-13 10 v-10 h-7 a10 10 0 0 1 -10 -10 v-20 a10 10 0 0 1 10 -10 z"/>
    <g id="tile-art">
      <rect x="-52" y="-52" width="104" height="104" rx="25" fill="url(#tile)"/>
      <rect x="-51.5" y="-51.5" width="103" height="103" rx="24.5" fill="none" stroke="#FFF" stroke-opacity="0.22"/>
      <use href="#glyph"/>
    </g>
  </defs>

  <rect x="160" y="10" width="400" height="220" rx="34" fill="url(#dock)"/>
  <rect x="160.5" y="10.5" width="399" height="219" rx="33.5" fill="none" stroke="#FFF" stroke-opacity="0.08"/>

  <g transform="translate(270 88)">
    <g filter="url(#shadow)"><use href="#tile-art"/></g>
    <circle cx="40" cy="40" r="24" fill="#1D1D22"/>
    <circle cx="40" cy="40" r="20" fill="#FAFAFA"/>
    <text x="40" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#18181B">1</text>
  </g>
  <g transform="translate(450 88)">
    <g filter="url(#shadow)"><use href="#tile-art"/></g>
    <circle cx="40" cy="40" r="24" fill="#1D1D22"/>
    <circle cx="40" cy="40" r="20" fill="#3B82F6"/>
    <text x="40" y="48" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#FFF">2</text>
  </g>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="270" y="184" font-size="17" font-weight="600" fill="#F4F4F5">Claude 1</text>
    <text x="270" y="206" font-size="14" fill="#A1A1AA">personal</text>
    <text x="450" y="184" font-size="17" font-weight="600" fill="#F4F4F5">Claude 2</text>
    <text x="450" y="206" font-size="14" fill="#A1A1AA">work</text>
  </g>
</svg>
