<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" width="720" height="220" role="img" aria-label="Two numbered launchers: Claude 1 for a personal account and Claude 2 for a work account">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#E3DED2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.18"/>
    </filter>
    <g id="glyph">
      <rect x="-30" y="-24" width="60" height="42" rx="12" fill="#9C9585"/>
      <path d="M-14 16 L-20 32 L-2 18 Z" fill="#9C9585"/>
      <circle cx="-13" cy="-3" r="5" fill="#F4F1EA"/>
      <circle cx="0" cy="-3" r="5" fill="#F4F1EA"/>
      <circle cx="13" cy="-3" r="5" fill="#F4F1EA"/>
    </g>
  </defs>
  <rect x="150" y="18" width="420" height="152" rx="34" fill="#1F1F23" opacity="0.06"/>
  <g transform="translate(250 88)" filter="url(#shadow)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#tile)"/>
    <use href="#glyph"/>
    <circle cx="40" cy="40" r="25" fill="#fff"/>
    <circle cx="40" cy="40" r="21" fill="#202024"/>
    <text x="40" y="48.5" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">1</text>
  </g>
  <g transform="translate(470 88)" filter="url(#shadow)">
    <rect x="-56" y="-56" width="112" height="112" rx="28" fill="url(#tile)"/>
    <use href="#glyph"/>
    <circle cx="40" cy="40" r="25" fill="#fff"/>
    <circle cx="40" cy="40" r="21" fill="#2563EB"/>
    <text x="40" y="48.5" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#fff">2</text>
  </g>
  <g font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="250" y="190" font-size="17" font-weight="600" fill="#6B6B73">Claude 1 · personal</text>
    <text x="470" y="190" font-size="17" font-weight="600" fill="#6B6B73">Claude 2 · work</text>
  </g>
</svg>
